name: Scheduled Auto Commit

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update heartbeat file
        run: |
          echo "Last updated: $(date -u)" > heartbeat.txt


      - name: Commit changes
        run: |
          git add heartbeat.txt
          git commit -m "🤖 Auto-update: $(date -u)" || echo "No changes to commit"

      - name: Push changes
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.MY_GITHUB_PAT }}@github.com/${{ github.repository }}
          git push origin HEAD
